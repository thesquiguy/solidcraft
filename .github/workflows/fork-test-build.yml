# Test branch only, never for upstream: an Apple Silicon macOS build of a combined test branch on the fork, on
# GitHub-hosted runners (upstream's test-build.yml runs only in tangency-labs). Pink app icon so the
# test build is easy to tell from an installed SolidCraft.
name: Fork combined test build (macOS)

on:
  push:
    branches: ["test-combined/**"]
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    # Apple Silicon only. Ad-hoc signed, not notarized: the first launch needs right-click > Open.
    if: github.repository_owner != 'tangency-labs' && true
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin
      - name: Version
        run: echo "SOLIDCRAFT_VERSION=0.48.0-test+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # The committed icon.icns is already pink; recompile the layered icon from the pink SVG
      # where this Xcode can (Icon Composer needs Xcode 26), else keep the committed one.
      - name: Pink layered icon
        continue-on-error: true
        run: |
          mkdir -p target/resources/macos-icon
          xcrun actool assets/icons/app/macos/source/SolidCraft.icon \
            --compile target/resources/macos-icon --platform macosx \
            --minimum-deployment-target 11.0 --app-icon SolidCraft \
            --output-partial-info-plist target/resources/macos-icon/icon-info.plist \
            --output-format human-readable-text
          cp target/resources/macos-icon/Assets.car assets/icons/app/macos/exports/Assets.car
          cp target/resources/macos-icon/SolidCraft.icns assets/icons/app/macos/exports/icon.icns
      - name: Build and package (dmg, ad-hoc signed)
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-pink-test-macos-dmg
          path: dist/release/*.dmg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  release:
    # Publishes both builds as a prerelease so they download without a GitHub sign-in.
    needs: [macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      TAG: test-combined
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Pink test build: See-Through, Measure Into Value, Slice Only, Move Face (kernel)" \
            --notes "Unsigned combined test build of ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), pink icon. Not an official SolidCraft release. Shift+T toggles See-Through on the selection, Alt+Shift+T makes everything opaque, in an open feature dialog Ctrl+Shift+D then a pick measures into the value field (a second pick gives a distance or angle). With a Section Analysis on, Alt+S shows only the cut face (Slice Only). Move Face is kernel-only so far, with no command in the app. Mac (Apple Silicon): open the dmg, drag to Applications, then right-click > Open the first time."
